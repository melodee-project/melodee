# CodeQL configuration
# This file configures which paths to analyze for both C# and JavaScript/TypeScript

name: "CodeQL config"

# Exclude paths from analysis
# Only analyze the main src/ directory
paths-ignore:
  # Exclude the entire melodee/ subdirectory (historical copy, not actively maintained)
  - 'melodee/**'
  
  # Exclude entire docs directory (contains Jekyll templates and vendored JS)
  - 'docs/**'
  
  # Exclude vendored/third-party JavaScript libraries  
  - '**/jquery*.js'
  - '**/lunr*.js'
  - '**/*.min.js'
  
  # Exclude benchmark and test directories from CodeQL analysis
  - 'benchmarks/**'
  - 'tests/**'
