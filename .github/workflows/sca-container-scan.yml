# Dependency vulnerability scanning and container image scanning
# Detects known vulnerabilities in dependencies and container images
#
# For dependency scanning: https://github.com/actions/dependency-review-action
# For container scanning: https://github.com/aquasecurity/trivy

name: Security Scanning (SCA + Container)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Vulnerability Scan (SCA)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail on high and critical vulnerabilities
          fail-on-severity: high
          # Comment on pull requests with details
          comment-summary-in-pr: on-failure

  container-scan:
    name: Container Image Scan (${{ matrix.platform-id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform-id: linux-amd64
            runner: ubuntu-24.04
            sarif-category: trivy-container-scan
          - platform: linux/arm64
            platform-id: linux-arm64
            runner: ubuntu-24.04-arm
            sarif-category: trivy-container-scan-linux-arm64
    env:
      SCAN_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build production Docker image for scanning
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if docker build \
              --pull \
              --platform "$SCAN_PLATFORM" \
              -t melodee:latest \
              .; then
              exit 0
            fi

            delay=$((attempt * 20))
            echo "Docker image build failed on attempt ${attempt}; retrying in ${delay}s..."
            sleep "$delay"
          done

          docker build \
            --pull \
            --platform "$SCAN_PLATFORM" \
            -t melodee:latest \
            .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'melodee:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          limit-severities-for-sarif: true
          version: 'v0.72.0'

      - name: Upload SARIF results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.sarif-category }}

      - name: Generate full Trivy vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
        with:
          image-ref: 'melodee:latest'
          format: 'json'
          output: 'trivy-full-results.json'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          scanners: 'vuln'
          skip-setup-trivy: true
          cache: false

      - name: Upload full Trivy vulnerability report
        if: always() && hashFiles('trivy-full-results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-full-results-${{ matrix.platform-id }}
          path: trivy-full-results.json
          if-no-files-found: error
          retention-days: 14

  nuget-vuln-scan:
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.104

      - name: Check for vulnerable NuGet packages
        run: |
          # Get all projects and check for vulnerabilities
          dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-vuln-report.txt
          
          # Check if there are any critical or high vulnerabilities
          if grep -q "Critical\|High" nuget-vuln-report.txt 2>/dev/null; then
            echo "Vulnerable packages found!"
            cat nuget-vuln-report.txt
            exit 1
          else
            echo "No critical or high vulnerabilities found."
            exit 0
          fi
